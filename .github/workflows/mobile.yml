name: Check mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - 'frontend/public/images/**'
      - 'frontend/public/fonts/**'
      - 'frontend/scripts/assets/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile.yml'
  push:
    branches: [master]
    paths:
      - 'mobile/**'
      - 'frontend/public/images/**'
      - 'frontend/public/fonts/**'
      - 'frontend/scripts/assets/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter pukki-mobile typecheck
      - run: pnpm --filter pukki-mobile test
      - run: pnpm --filter pukki-mobile run doctor
      - run: pnpm build:mobile
